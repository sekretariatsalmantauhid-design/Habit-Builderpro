<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Panggil Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F3F4F6">
    <title>Habit Builder Pro - Asatidzah Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sheet-bg': '#F3F4F6',
                        'sheet-line': '#D1D5DB',
                    },
                    fontFamily: {
                        'sans': ['Arial', 'Helvetica', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style type="text/css">
        body { background-color: #e5e7eb; padding: 0; margin: 0; }
        * { border-radius: 0 !important; }

        .custom-scroll::-webkit-scrollbar { height: 10px; width: 10px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #c1c1c1; border: 2px solid #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        .sheet-table { border-collapse: collapse; width: max-content; min-width: 100%; background: white; }
        .sheet-table th, .sheet-table td { 
            border: 1px solid #D1D5DB; 
            padding: 2px 4px; 
            text-align: center; 
            font-size: 11px; 
            height: 24px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .sheet-table thead th { background-color: #F9FAFB; font-weight: normal; color: #6B7280; }
        .sheet-table thead tr.days-row th { background-color: white; color: #111827; font-weight: bold;}

        .sticky-col-header { position: sticky; left: 0; background-color: #F9FAFB; z-index: 10; border-right: 2px solid #9CA3AF; }
        .sticky-col-data { position: sticky; left: 0; background-color: white; z-index: 5; border-right: 2px solid #9CA3AF; text-align: left; padding-left: 8px;}

        .habit-checkbox { cursor: pointer; appearance: none; -webkit-appearance: none; display: flex; align-items: center; justify-content: center; width: 14px; height: 14px; border: 1px solid #9CA3AF; background-color: white; position: relative; margin: auto;}
        .habit-checkbox:checked { background-color: #374151; border-color: #374151; }
        .habit-checkbox:checked::after { content: '\2713'; font-size: 10px; color: white; position: absolute; }

        .dotted-line { border-bottom: 1px dotted #9CA3AF; padding-bottom: 1px; }
    </style>
</head>
<body class="font-sans text-xs h-screen flex flex-col">

    <div class="bg-white shadow-lg border-b border-gray-300 flex-1 flex flex-col overflow-hidden">
        
        <!-- TOP TOOLBAR -->
        <div class="border-b border-gray-300 bg-gray-50 p-1 flex items-center gap-2 z-30">
            <button onclick="addHabit()" class="bg-white border border-gray-300 px-3 py-1 hover:bg-gray-100 font-bold"><i class="fa-solid fa-plus mr-1 text-green-600"></i> Habit Harian</button>
            <button onclick="copyPrevMonthHabits()" class="bg-white border border-gray-300 px-3 py-1 hover:bg-gray-100 text-gray-700" title="Salin habit dari bulan sebelumnya"><i class="fa-solid fa-copy text-blue-500 mr-1"></i> Copy Data Bulan Lalu</button>
            <button onclick="resetData()" class="bg-white border border-gray-300 px-3 py-1 text-red-600 hover:bg-red-50 ml-auto"><i class="fa-solid fa-trash-can mr-1"></i> Factory Reset</button>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 overflow-hidden flex flex-col relative">
            
            <!-- VIEW 1: TRACKER -->
            <div id="view-tracker" class="absolute inset-0 flex flex-col overflow-hidden">
                
                <div class="p-4 border-b border-gray-200 shrink-0">
                    <div class="flex justify-between items-start">
                        <div>
                            <h1 class="text-3xl font-black tracking-tighter uppercase text-gray-900" style="font-family: 'Arial Black', sans-serif">HABIT BUILDER</h1>
                            <h2 class="text-5xl font-extrabold uppercase mt-[-5px]" id="display-month-name">MONTH</h2>
                        </div>
                        <div class="text-right border border-gray-300 p-2 min-w-[150px]">
                            <div class="flex justify-between"><span>MONTH</span><span class="font-bold dotted-line w-16 text-center" id="display-month-short">Mon</span></div>
                            <div class="flex justify-between mt-1 items-center">
    <span>YEAR</span>
    <div class="flex items-center gap-2">
        <button onclick="changeYear(-1)" class="text-gray-400 hover:text-blue-600"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
        <span class="font-bold dotted-line w-12 text-center" id="display-year">2026</span>
        <button onclick="changeYear(1)" class="text-gray-400 hover:text-blue-600"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
    </div>
</div>
                        </div>
                    </div>
                </div>

                <!-- Table Area -->
                    <div class="flex-1 flex flex-col overflow-hidden" id="table-container">

                        <!-- WRAPPER SCROLL KHUSUS TABEL HARIAN -->
    <div class="flex-1 overflow-auto custom-scroll">
                    <!-- TABEL UTAMA: HARIAN -->
                    <table class="sheet-table shrink-0">
                        <thead>
                            <tr class="week-row">
                                <th rowspan="3" class="sticky-col-header text-lg font-bold text-gray-900 text-left pl-2 border-r-2 border-gray-400" width="280px">My Habits</th>
                                <th colspan="7" class="border-l-2 border-gray-300">WEEK 1</th>
                                <th colspan="7" class="border-l-2 border-gray-300">WEEK 2</th>
                                <th colspan="7" class="border-l-2 border-gray-300">WEEK 3</th>
                                <th colspan="7" class="border-l-2 border-gray-300">WEEK 4</th>
                                <th colspan="3" class="border-l-2 border-gray-300 border-r-2 border-gray-300">WEEK 5</th>
                                <th rowspan="3" class="w-12 border-l-2 border-gray-400">GOAL</th>
                                <th rowspan="3" class="w-12">%</th>
                                <th rowspan="3" class="w-20 border-r-2 border-gray-300">COUNT</th>
                            </tr>
                            <tr class="day-names-row"></tr>
                            <tr class="days-row"></tr>
                        </thead>
                        <tbody id="habit-body">
                            <!-- JS Generates Daily Habits Here -->
                        </tbody>
                    </table>
                    </div> <!-- Tanda tutup div wrapper scroll -->
                    
                    <!-- TARGET TABLES (INDEPENDENT) -->
                    <div class="p-4 border-t-2 border-gray-400 bg-gray-50 mt-auto shrink-0 border-b-2">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            
                            <!-- TARGET PEKANAN -->
                            <div class="overflow-x-auto">
                                <table class="sheet-table w-full bg-white shadow-sm border border-gray-300">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="font-bold text-gray-800 py-1 text-left pl-2">
                                                TARGET PEKANAN 
                                                <button onclick="addTarget('weekly')" class="text-green-600 ml-2 border border-green-600 bg-white px-1 rounded hover:bg-green-50"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                            </th>
                                            <th class="w-6">W1</th><th class="w-6">W2</th><th class="w-6">W3</th><th class="w-6">W4</th>
                                            <th class="w-10">%</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tbody-target-weekly"></tbody>
                                </table>
                            </div>

                            <!-- TARGET BULANAN -->
                            <div class="overflow-x-auto">
                                <table class="sheet-table w-full bg-white shadow-sm border border-gray-300">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="font-bold text-gray-800 py-1 text-left pl-2">
                                                TARGET BULANAN 
                                                <button onclick="addTarget('monthly')" class="text-green-600 ml-2 border border-green-600 bg-white px-1 rounded hover:bg-green-50"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                            </th>
                                            <th class="w-12">Done</th>
                                            <th class="w-10">%</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tbody-target-monthly"></tbody>
                                </table>
                            </div>

                            <!-- TARGET TAHUNAN -->
                            <div class="overflow-x-auto">
                                <table class="sheet-table w-full bg-white shadow-sm border border-gray-300">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="font-bold text-gray-800 py-1 text-left pl-2">
                                                TARGET TAHUNAN 
                                                <button onclick="addTarget('yearly')" class="text-green-600 ml-2 border border-green-600 bg-white px-1 rounded hover:bg-green-50"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                            </th>
                                            <th class="w-12">Done</th>
                                            <th class="w-10">%</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tbody-target-yearly"></tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Footer Summary (Untuk Harian) -->
                <div class="bg-gray-100 p-2 flex gap-6 shrink-0">
                    <div class="border border-gray-300 p-2 bg-white w-40">
                        <div class="font-bold text-center border-b border-gray-300 pb-1 mb-2">DAILY SUMMARY</div>
                        <div class="text-center">
                            <div class="text-3xl font-black text-gray-900" id="stat-daily-completed">0 / 0</div>
                            <div class="text-xxs uppercase text-gray-500 tracking-wider">DAILY HABITS</div>
                        </div>
                    </div>
                    <table class="sheet-table w-auto bg-white" style="width: 250px;">
                        <thead class="bg-gray-100">
                            <tr><th>METRIC</th><th>COUNT</th></tr>
                        </thead>
                        <tbody>
                            <tr><td class="text-left pl-2 text-gray-500">% Completed</td><td class="font-bold text-base" id="stat-perc-completed">0%</td></tr>
                            <tr><td class="text-left pl-2 text-gray-500">Completed</td><td class="font-medium" id="stat-count-completed">0</td></tr>
                            <tr><td class="text-left pl-2 text-gray-500">Incomplete</td><td class="font-medium" id="stat-count-incomplete">0</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- VIEW 2: STATS -->
            <div id="view-stats" class="absolute inset-0 flex flex-col overflow-hidden hidden">
                <div class="p-6 border-b border-gray-200 bg-white shrink-0">
                    <h1 class="text-4xl font-bold text-gray-950">Yearly Statistics</h1>
                </div>
                <div class="flex-1 overflow-auto p-6 bg-sheet-bg custom-scroll">
                    <div class="bg-white border border-gray-300 p-2 mb-6 h-64 relative">
                        <canvas id="yearlyChart"></canvas>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stat-month-grid">
                        <!-- JS Generates Cards Here -->
                    </div>
                </div>
            </div>

        </div>

        <!-- BOTTOM TAB NAVIGATION -->
        <div class="border-t border-gray-300 bg-gray-200 p-1 flex items-center gap-1 text-sm z-30 overflow-x-auto custom-scroll shrink-0">
            <div class="flex gap-0.5" id="month-tabs-container"></div>
            <button onclick="switchView('stats')" id="tab-stats" class="ml-2 px-4 py-1 flex items-center gap-1 border border-blue-300 bg-blue-100 text-blue-900 font-medium hover:bg-blue-200 sticky right-0">
                Statistics <i class="fa-solid fa-chart-line ml-1"></i>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Update Versi Storage jadi v5 agar data lama yang strukturnya beda tidak error
        const STORAGE_KEY = 'asatidzah_pro_habit_v5';
        const monthNamesFull = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
        const monthNamesShort = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const dayNames = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
        
        let currentDate = new Date();
        
        // Initial State Baru
        let state = {
            activeView: 'tracker',
            selectedMonthIdx: currentDate.getMonth(),
            currentYear: currentDate.getFullYear(),
            habits: {}, 
            records: {}, 
            targets: {
                weekly: {},  // Format: { 'YYYY-MM': [ {id, name, w1, w2, w3, w4} ] }
                monthly: {}, // Format: { 'YYYY-MM': [ {id, name, done} ] }
                yearly: {}   // Format: { 'YYYY': [ {id, name, done} ] } - Tahunan nempel di tahun
            }
        };

        let yearlyChart = null;

        // --- CORE FUNCTIONS ---
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
                // Pastikan obyek targets tidak undefined kalau load dari versi lama
                if (!state.targets) state.targets = { weekly: {}, monthly: {}, yearly: {} };
                if (!state.targets.weekly) state.targets.weekly = {};
                if (!state.targets.monthly) state.targets.monthly = {};
                if (!state.targets.yearly) state.targets.yearly = {};
                
                state.currentYear = currentDate.getFullYear();
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            updateSummaryStats();
        }

        function getMonthKey(year, monthIdx) { return `${year}-${monthIdx}`; }
        function getYearKey(year) { return `${year}`; }
        function getDaysInMonth(year, monthIdx) { return new Date(year, monthIdx + 1, 0).getDate(); }

        // --- DOM MANIPULATION ---
        function init() {
            loadData();
            renderTabs();
            renderTrackerStructure();
            switchView(state.activeView);
        }

        function switchView(viewName) {
            state.activeView = viewName;
            const trackerEl = document.getElementById('view-tracker');
            const statsEl = document.getElementById('view-stats');
            const tabStatsBtn = document.getElementById('tab-stats');

            if (viewName === 'tracker') {
                trackerEl.classList.remove('hidden');
                statsEl.classList.add('hidden');
                tabStatsBtn.classList.add('bg-blue-100', 'text-blue-900');
                tabStatsBtn.classList.remove('bg-gray-800', 'text-white');
                renderTrackerStructure();
                renderTrackerData();
                renderTargetTables();
                renderTabs();
            } else {
                trackerEl.classList.add('hidden');
                statsEl.classList.remove('hidden');
                tabStatsBtn.classList.remove('bg-blue-100', 'text-blue-900');
                tabStatsBtn.classList.add('bg-gray-800', 'text-white');
                renderStatsPage();
            }
            saveData();
        }
        
function changeYear(offset) {
    state.currentYear += offset;
    saveData();
    
    // Update UI sesuai tahun yang baru dipilih
    renderTrackerStructure();
    
    if(state.activeView === 'tracker') {
        renderTrackerData();
        renderTargetTables();
    } else {
        renderStatsPage();
    }
}

        function renderTabs() {
            const container = document.getElementById('month-tabs-container');
            container.innerHTML = '';
            monthNamesShort.forEach((mon, idx) => {
                const btn = document.createElement('button');
                btn.innerText = mon.toUpperCase();
                btn.className = "px-4 py-1.5 border border-gray-300 hover:bg-gray-300 transition-colors";
                if (state.activeView === 'tracker' && idx === state.selectedMonthIdx) {
                    btn.classList.add('bg-white', 'font-black', 'text-black', 'border-b-4', 'border-b-blue-600');
                } else {
                    btn.classList.add('bg-gray-100', 'text-gray-600');
                }
                btn.onclick = () => { state.selectedMonthIdx = idx; switchView('tracker'); };
                container.appendChild(btn);
            });
        }

        function renderTrackerStructure() {
            const monthIdx = state.selectedMonthIdx;
            const daysInMonth = getDaysInMonth(state.currentYear, monthIdx);

            document.getElementById('display-month-name').innerText = monthNamesFull[monthIdx];
            document.getElementById('display-month-short').innerText = monthNamesShort[monthIdx];
            document.getElementById('display-year').innerText = state.currentYear;

            const dayNamesRow = document.querySelector('thead tr.day-names-row');
            const daysRow = document.querySelector('thead tr.days-row');
            dayNamesRow.innerHTML = '';
            daysRow.innerHTML = '';

            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(state.currentYear, monthIdx, d);
                const dayName = dayNames[dateObj.getDay()];

                const thName = document.createElement('th');
                thName.innerText = dayName;
                thName.className = "border-l border-gray-300 w-8 min-w-[32px]";
                if (dayName === 'Sa' || dayName === 'Su') thName.classList.add('bg-gray-100', 'text-red-500');
                dayNamesRow.appendChild(thName);

                const thDay = document.createElement('th');
                thDay.innerText = d;
                thDay.className = "border-l border-gray-300 font-bold w-8 min-w-[32px]";
                if (dayName === 'Sa' || dayName === 'Su') thDay.classList.add('bg-gray-100', 'text-red-500');
                if (d % 7 === 1) thDay.classList.add('border-l-2');
                daysRow.appendChild(thDay);
            }
        }

        // === HARIAN HABITS LOGIC ===
        function renderTrackerData() {
            const monthKey = getMonthKey(state.currentYear, state.selectedMonthIdx);
            const habits = state.habits[monthKey] || [];
            const daysInMonth = getDaysInMonth(state.currentYear, state.selectedMonthIdx);
            const tbody = document.getElementById('habit-body');
            tbody.innerHTML = '';

            if(habits.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${daysInMonth + 4}" class="p-8 text-gray-400 italic">Belum ada habit Harian. Klik tombol "+ Habit Harian" di atas.</td></tr>`;
            }

            habits.forEach((habit, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 group";

                const tdName = document.createElement('td');
                tdName.className = "sticky-col-data border-r-2 border-gray-400 flex justify-between items-center";
                tdName.innerHTML = `
                    <div class="flex-1 truncate" title="${habit.name}"><span class="text-gray-400 mr-2 font-mono text-[10px]">${index + 1}</span> ${habit.name}</div>
                    <div class="hidden group-hover:flex gap-1 ml-2">
                        <button onclick="editHabit(${habit.id})" class="text-blue-500 hover:bg-blue-100 px-1 rounded"><i class="fa-solid fa-pen text-[10px]"></i></button>
                        <button onclick="deleteHabit(${habit.id})" class="text-red-500 hover:bg-red-100 px-1 rounded"><i class="fa-solid fa-trash text-[10px]"></i></button>
                    </div>
                `;
                tr.appendChild(tdName);

                let habitCompletedCount = 0;
                for (let d = 1; d <= daysInMonth; d++) {
                    const tdCheck = document.createElement('td');
                    tdCheck.className = "border-l border-gray-200 p-0";
                    const recordKey = `${monthKey}-${d}-${habit.id}`;
                    const isChecked = state.records[recordKey] || false;
                    
                    if(isChecked) habitCompletedCount++;

                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.className = "habit-checkbox";
                    cb.checked = isChecked;
                    cb.onchange = (e) => toggleRecord(recordKey, e.target.checked);
                    tdCheck.appendChild(cb);
                    tr.appendChild(tdCheck);
                }

                const tdGoal = document.createElement('td');
                tdGoal.innerText = "100%"; tdGoal.className = "bg-gray-50 text-gray-400 border-l-2 border-gray-400";
                tr.appendChild(tdGoal);

                const tdPerc = document.createElement('td');
                const perc = daysInMonth > 0 ? Math.round((habitCompletedCount / daysInMonth) * 100) : 0;
                tdPerc.innerText = `${perc}%`;
                tdPerc.className = perc > 0 ? "font-bold text-gray-900 bg-gray-50" : "text-gray-400 bg-gray-50";
                tr.appendChild(tdPerc);

                const tdCount = document.createElement('td');
                tdCount.innerText = `${habitCompletedCount} / ${daysInMonth}`;
                tdCount.className = "text-left pl-2 font-mono text-gray-500 bg-gray-50 border-r-2 border-gray-300";
                tr.appendChild(tdCount);

                tbody.appendChild(tr);
            });

            updateSummaryStats();
        }

        function toggleRecord(key, isChecked) {
            if (isChecked) { state.records[key] = true; } 
            else { delete state.records[key]; }
            saveData();
            renderTrackerData();
        }

        // === TARGET PEKAN, BULAN, TAHUN LOGIC ===
        function renderTargetTables() {
            const monthKey = getMonthKey(state.currentYear, state.selectedMonthIdx);
            const yearKey = getYearKey(state.currentYear);

            // Render Target Pekanan
            const tbodyW = document.getElementById('tbody-target-weekly');
            tbodyW.innerHTML = '';
            const wT = state.targets.weekly[monthKey] || [];
            if(wT.length === 0) tbodyW.innerHTML = `<tr><td colspan="6" class="p-2 text-gray-400 italic">Kosong</td></tr>`;
            wT.forEach((t, i) => {
                let count = (t.w1?1:0) + (t.w2?1:0) + (t.w3?1:0) + (t.w4?1:0);
                let perc = Math.round((count/4)*100);
                tbodyW.innerHTML += `
                    <tr class="hover:bg-gray-50 group">
                        <td class="text-left pl-2 truncate flex justify-between">
                            <span><span class="text-gray-400 mr-1 font-mono text-[10px]">${i+1}</span> ${t.name}</span>
                            <div class="hidden group-hover:flex gap-1 ml-2">
                                <button onclick="editTarget('weekly', ${t.id})" class="text-blue-500 hover:bg-blue-100 px-1 rounded"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                <button onclick="deleteTarget('weekly', ${t.id})" class="text-red-500 hover:bg-red-100 px-1 rounded"><i class="fa-solid fa-trash text-[10px]"></i></button>
                            </div>
                        </td>
                        <td><input type="checkbox" class="habit-checkbox" ${t.w1 ? 'checked' : ''} onchange="toggleTargetCheck('weekly', ${t.id}, 'w1', this.checked)"></td>
                        <td><input type="checkbox" class="habit-checkbox" ${t.w2 ? 'checked' : ''} onchange="toggleTargetCheck('weekly', ${t.id}, 'w2', this.checked)"></td>
                        <td><input type="checkbox" class="habit-checkbox" ${t.w3 ? 'checked' : ''} onchange="toggleTargetCheck('weekly', ${t.id}, 'w3', this.checked)"></td>
                        <td><input type="checkbox" class="habit-checkbox" ${t.w4 ? 'checked' : ''} onchange="toggleTargetCheck('weekly', ${t.id}, 'w4', this.checked)"></td>
                        <td class="bg-gray-50 ${perc > 0 ? 'font-bold text-gray-900' : 'text-gray-400'}">${perc}%</td>
                    </tr>
                `;
            });

            // Render Target Bulanan
            const tbodyM = document.getElementById('tbody-target-monthly');
            tbodyM.innerHTML = '';
            const mT = state.targets.monthly[monthKey] || [];
            if(mT.length === 0) tbodyM.innerHTML = `<tr><td colspan="3" class="p-2 text-gray-400 italic">Kosong</td></tr>`;
            mT.forEach((t, i) => {
                let perc = t.done ? 100 : 0;
                tbodyM.innerHTML += `
                    <tr class="hover:bg-gray-50 group">
                        <td class="text-left pl-2 truncate flex justify-between">
                            <span><span class="text-gray-400 mr-1 font-mono text-[10px]">${i+1}</span> ${t.name}</span>
                            <div class="hidden group-hover:flex gap-1 ml-2">
                                <button onclick="editTarget('monthly', ${t.id})" class="text-blue-500 hover:bg-blue-100 px-1 rounded"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                <button onclick="deleteTarget('monthly', ${t.id})" class="text-red-500 hover:bg-red-100 px-1 rounded"><i class="fa-solid fa-trash text-[10px]"></i></button>
                            </div>
                        </td>
                        <td><input type="checkbox" class="habit-checkbox" ${t.done ? 'checked' : ''} onchange="toggleTargetCheck('monthly', ${t.id}, 'done', this.checked)"></td>
                        <td class="bg-gray-50 ${perc > 0 ? 'font-bold text-gray-900' : 'text-gray-400'}">${perc}%</td>
                    </tr>
                `;
            });

            // Render Target Tahunan
            const tbodyY = document.getElementById('tbody-target-yearly');
            tbodyY.innerHTML = '';
            const yT = state.targets.yearly[yearKey] || [];
            if(yT.length === 0) tbodyY.innerHTML = `<tr><td colspan="3" class="p-2 text-gray-400 italic">Kosong</td></tr>`;
            yT.forEach((t, i) => {
                let perc = t.done ? 100 : 0;
                tbodyY.innerHTML += `
                    <tr class="hover:bg-gray-50 group">
                        <td class="text-left pl-2 truncate flex justify-between">
                            <span><span class="text-gray-400 mr-1 font-mono text-[10px]">${i+1}</span> ${t.name}</span>
                            <div class="hidden group-hover:flex gap-1 ml-2">
                                <button onclick="editTarget('yearly', ${t.id})" class="text-blue-500 hover:bg-blue-100 px-1 rounded"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                <button onclick="deleteTarget('yearly', ${t.id})" class="text-red-500 hover:bg-red-100 px-1 rounded"><i class="fa-solid fa-trash text-[10px]"></i></button>
                            </div>
                        </td>
                        <td><input type="checkbox" class="habit-checkbox" ${t.done ? 'checked' : ''} onchange="toggleTargetCheck('yearly', ${t.id}, 'done', this.checked)"></td>
                        <td class="bg-gray-50 ${perc > 0 ? 'font-bold text-gray-900' : 'text-gray-400'}">${perc}%</td>
                    </tr>
                `;
            });
        }

        function addTarget(type) {
            let label = type === 'weekly' ? 'Pekanan' : type === 'monthly' ? 'Bulanan' : 'Tahunan';
            const name = prompt(`Masukkan nama Target ${label}:`);
            if (name && name.trim() !== "") {
                const monthKey = getMonthKey(state.currentYear, state.selectedMonthIdx);
                const yearKey = getYearKey(state.currentYear);
                
                if(type === 'weekly') {
                    if(!state.targets.weekly[monthKey]) state.targets.weekly[monthKey] = [];
                    state.targets.weekly[monthKey].push({ id: Date.now(), name: name.trim(), w1:false, w2:false, w3:false, w4:false });
                } else if(type === 'monthly') {
                    if(!state.targets.monthly[monthKey]) state.targets.monthly[monthKey] = [];
                    state.targets.monthly[monthKey].push({ id: Date.now(), name: name.trim(), done:false });
                } else if(type === 'yearly') {
                    if(!state.targets.yearly[yearKey]) state.targets.yearly[yearKey] = [];
                    state.targets.yearly[yearKey].push({ id: Date.now(), name: name.trim(), done:false });
                }
                saveData();
                renderTargetTables();
            }
        }

        function editTarget(type, id) {
            const monthKey = getMonthKey(state.currentYear, state.selectedMonthIdx);
            const yearKey = getYearKey(state.currentYear);
            let arr = type === 'yearly' ? state.targets[type][yearKey] : state.targets[type][monthKey];
            let item = arr.find(t => t.id === id);
            
            if(item) {
                const newName = prompt("Edit nama target:", item.name);
                if(newName && newName.trim() !== "") {
                    item.name = newName.trim();
                    saveData();
                    renderTargetTables();
                }
            }
        }

        function deleteTarget(type, id) {
            if(confirm("Hapus target ini?")) {
                const monthKey = getMonthKey(state.currentYear, state.selectedMonthIdx);
                const yearKey = getYearKey(state.currentYear);
                if(type === 'yearly') {
                    state.targets[type][yearKey] = state.targets[type][yearKey].filter(t => t.id !== id);
                } else {
                    state.targets[type][monthKey] = state.targets[type][monthKey].filter(t => t.id !== id);
                }
                saveData();
                renderTargetTables();
            }
        }

        function toggleTargetCheck(type, id, key, isChecked) {
            const monthKey = getMonthKey(state.currentYear, state.selectedMonthIdx);
            const yearKey = getYearKey(state.currentYear);
            let arr = type === 'yearly' ? state.targets[type][yearKey] : state.targets[type][monthKey];
            let item = arr.find(t => t.id === id);
            if(item) {
                item[key] = isChecked;
                saveData();
                renderTargetTables();
            }
        }

        // === HABIT HARIAN MANAGEMENT ===
        function addHabit() {
            const name = prompt("Masukkan nama Habit Harian baru:");
            if (name && name.trim() !== "") {
                const monthKey = getMonthKey(state.currentYear, state.selectedMonthIdx);
                if(!state.habits[monthKey]) state.habits[monthKey] = [];
                state.habits[monthKey].push({ id: Date.now(), name: name.trim() });
                saveData();
                renderTrackerData();
            }
        }

        function editHabit(id) {
            const monthKey = getMonthKey(state.currentYear, state.selectedMonthIdx);
            const habit = state.habits[monthKey].find(h => h.id === id);
            if(habit) {
                const newName = prompt("Edit nama Habit:", habit.name);
                if(newName && newName.trim() !== "") {
                    habit.name = newName.trim();
                    saveData();
                    renderTrackerData();
                }
            }
        }

        function deleteHabit(id) {
            if(confirm("Hapus habit harian ini dari bulan aktif?")) {
                const monthKey = getMonthKey(state.currentYear, state.selectedMonthIdx);
                state.habits[monthKey] = state.habits[monthKey].filter(h => h.id !== id);
                saveData();
                renderTrackerData();
            }
        }

        function copyPrevMonthHabits() {
            const prevMonthIdx = state.selectedMonthIdx === 0 ? 11 : state.selectedMonthIdx - 1;
            const prevYear = state.selectedMonthIdx === 0 ? state.currentYear - 1 : state.currentYear;
            const prevKey = getMonthKey(prevYear, prevMonthIdx);
            const currKey = getMonthKey(state.currentYear, state.selectedMonthIdx);

            const prevHabits = state.habits[prevKey] || [];
            if(prevHabits.length === 0) {
                alert(`Bos, data bulan ${monthNamesFull[prevMonthIdx]} ${prevYear} kosong. Tidak ada yang bisa di-copy.`);
                return;
            }

            if(confirm(`Yakin mau salin ${prevHabits.length} habit dari bulan lalu? Data yang sudah ada di bulan ini akan dipertahankan.`)) {
                if(!state.habits[currKey]) state.habits[currKey] = [];
                
                prevHabits.forEach(ph => {
                    const exists = state.habits[currKey].find(ch => ch.name.toLowerCase() === ph.name.toLowerCase());
                    if(!exists) { state.habits[currKey].push({ id: Date.now() + Math.random(), name: ph.name }); }
                });
                
                saveData();
                renderTrackerData();
            }
        }

        function resetData() {
            if (confirm("BAHAYA BOS! Yakin mau HAPUS SEMUA data dan rekor? Tidak bisa dikembalikan lho.")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        // === STATS & SUMMARY ===
        function updateSummaryStats() {
            if(state.activeView !== 'tracker') return;
            const monthKey = getMonthKey(state.currentYear, state.selectedMonthIdx);
            const habits = state.habits[monthKey] || [];
            const daysInMonth = getDaysInMonth(state.currentYear, state.selectedMonthIdx);
            const totalPossible = habits.length * daysInMonth;
            let totalCompleted = 0;

            for (let d = 1; d <= daysInMonth; d++) {
                habits.forEach(h => {
                    if (state.records[`${monthKey}-${d}-${h.id}`]) totalCompleted++;
                });
            }

            const perc = totalPossible > 0 ? ((totalCompleted / totalPossible) * 100).toFixed(1) : "0.0";
            document.getElementById('stat-daily-completed').innerText = `${totalCompleted} / ${totalPossible}`;
            document.getElementById('stat-perc-completed').innerText = `${perc}%`;
            document.getElementById('stat-count-completed').innerText = totalCompleted;
            document.getElementById('stat-count-incomplete').innerText = totalPossible - totalCompleted;
        }

        function renderStatsPage() {
            const grid = document.getElementById('stat-month-grid');
            grid.innerHTML = '';
            let yearlyDataPercentages = [];

            monthNamesFull.forEach((monName, idx) => {
                const monthKey = getMonthKey(state.currentYear, idx);
                const habits = state.habits[monthKey] || [];
                const daysInMon = getDaysInMonth(state.currentYear, idx);
                const totalPossible = habits.length * daysInMon;
                let totalComp = 0;

                for (let d = 1; d <= daysInMon; d++) {
                    habits.forEach(h => {
                        if (state.records[`${monthKey}-${d}-${h.id}`]) totalComp++;
                    });
                }

                const perc = totalPossible > 0 ? ((totalComp / totalPossible) * 100).toFixed(1) : "0.0";
                yearlyDataPercentages.push(parseFloat(perc));

                const card = document.createElement('div');
                card.className = "bg-white border border-gray-300 text-xxs font-mono shadow-sm";
                card.innerHTML = `
                    <div class="bg-gray-950 text-white text-center py-1.5 font-bold text-xs tracking-widest">${monName}</div>
                    <div class="p-2 space-y-1">
                        <div class="flex justify-between border-b border-gray-200 pb-1"><span class="text-gray-500">Total Habit</span><span class="font-bold text-gray-950 dotted-line w-16 text-center">${totalComp} / ${totalPossible}</span></div>
                        <div class="flex justify-between"><span class="text-gray-500">Completed</span><span class="dotted-line w-16 text-center">${totalComp}</span></div>
                        <div class="flex justify-between"><span class="text-gray-500">Incomplete</span><span class="dotted-line w-16 text-center">${totalPossible - totalComp}</span></div>
                    </div>
                    <div class="bg-gray-50 p-2 border-t border-gray-200 flex justify-between items-center">
                        <span class="font-bold text-gray-700 text-xs">Percentage</span>
                        <span class="text-xl font-black ${parseFloat(perc) > 0 ? 'text-blue-600' : 'text-gray-950'}">${perc}%</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderYearlyChart(yearlyDataPercentages);
        }

        function renderYearlyChart(dataPerc) {
            const ctx = document.getElementById('yearlyChart').getContext('2d');
            if (yearlyChart) yearlyChart.destroy();
            yearlyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: monthNamesShort,
                    datasets: [{
                        label: 'Yearly Progress',
                        data: dataPerc,
                        borderColor: '#2563EB', 
                        backgroundColor: 'rgba(37, 99, 235, 0.15)', 
                        borderWidth: 2, fill: true, tension: 0.3,
                        pointBackgroundColor: '#1E3A8A', pointRadius: 3,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, layout: { padding: 10 },
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { stepSize: 20, callback: v => v + '%', font: { size: 10, family: 'monospace' } }, grid: { color: '#E5E7EB' } },
                        x: { ticks: { font: { size: 10, family: 'monospace' } }, grid: { display: false } }
                    },
                    plugins: { legend: { display: false }, tooltip: { enabled: true, callbacks: { label: (ctx) => ` ${ctx.parsed.y}%` } } }
                }
            });
        }

        window.onload = init;
    </script>
    <script>
  // Registrasi Service Worker untuk PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(registration => {
          console.log('ServiceWorker mantap! Scope:', registration.scope);
        })
        .catch(err => {
          console.log('Yah, ServiceWorker gagal registrasi: ', err);
        });
    });
  }
</script>
</body>
</html>
